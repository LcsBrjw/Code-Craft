    <title>Code&Craft - Réinitialisation du mot de passe</title>
</head>

<body id="new-password">
    <main>
        <div class="layout1"></div>
        <div class="layout2"></div>
        <section id="reinit">
            <div>
                <img class="logo" src="./src/img/logo-light.png" alt="">
            </div>
            <form action="" class="reinit-form">
                <h2>Réinitialisation du mot de passe</h2>
                <div class="reinit-form-part">
                    <label for="email">Adresse e-mail :</label>
                    <input type="email" placeholder="ex : xyz@xyz.fr">
                </div>
                <div class="reinit-form-part">
                    <label for="password">Nouveau mot de passe :</label>
                    <input type="password">
                </div>
                <div class="reinit-form-part">
                    <label for="password2">Vérifier mot de passe :</label>
                    <input type="password">
                </div>

            </form>
            <div class="reinit-buttons">
                <button type="submit" id="reinit-valid">Valider</button>
                <a id="back-home" href="./index.html">Retour à l'accueil</a>
            </div>
        </section>
    </main>
   
<script src="script.js"></script>

</body>



</html>
